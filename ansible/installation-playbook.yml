---
- name: Update Ubuntu and Install Java
  hosts: appserver
  become: true
  vars:
    pkgs:
      - docker.io
      - docker-compose-v2

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Packages
      ansible.builtin.apt:
        name: "{{ pkgs }}"
        state: present

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes